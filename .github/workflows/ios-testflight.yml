name: Upload iOS to TestFlight
on:
  workflow_dispatch:
    inputs:
      team_id:
        description: Apple Developer Team ID (10 characters)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: domira-testflight
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/v2.0'
    runs-on: macos-latest
    timeout-minutes: 35
    environment: testflight
    env:
      APPLE_TEAM_ID: ${{ inputs.team_id }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare Apple API authentication
        run: |
          python3 - <<'PY'
          import os,re,pathlib
          for key in ['ASC_KEY_ID','ASC_ISSUER_ID','ASC_PRIVATE_KEY']:
              if not os.environ.get(key): raise SystemExit('Missing GitHub Actions secret: '+key)
          if not re.fullmatch(r'[A-Z0-9]{10}',os.environ['APPLE_TEAM_ID']): raise SystemExit('Invalid Team ID')
          if not re.fullmatch(r'[A-Za-z0-9]+',os.environ['ASC_KEY_ID']): raise SystemExit('Invalid key ID')
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'private_keys'
          folder.mkdir(mode=0o700)
          keyfile=folder/('AuthKey_'+os.environ['ASC_KEY_ID']+'.p8')
          keyfile.write_text(os.environ['ASC_PRIVATE_KEY'])
          keyfile.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('API_PRIVATE_KEYS_DIR='+str(folder)+'\n')
              env.write('ASC_KEY_PATH='+str(keyfile)+'\n')
          PY
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Archive with Apple managed signing
        run: >-
          xcodebuild -project ios/Domira.xcodeproj -scheme Domira -configuration Release
          -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Domira.xcarchive"
          -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH"
          -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive
      - name: Export signed App Store package
        run: |
          python3 - <<'PY'
          import os,plistlib,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'ExportOptions.plist'
          p.write_bytes(plistlib.dumps({'method':'app-store-connect','teamID':os.environ['APPLE_TEAM_ID'],'signingStyle':'automatic','manageAppVersionAndBuildNumber':False}))
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Domira.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Upload beta to App Store Connect
        run: >-
          xcrun iTMSTransporter -m upload -assetFile "$RUNNER_TEMP/export/Domira.ipa"
          -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID"
      - name: Remove temporary Apple private key
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib,shutil
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'private_keys'
          if p.is_dir(): shutil.rmtree(p)
          PY
