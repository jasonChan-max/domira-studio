name: Domira
options:
  bundleIdPrefix: ltd.duomo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
targets:
  Domira:
    type: application
    platform: iOS
    sources: [Domira]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ltd.duomo.domira
        INFOPLIST_FILE: Domira/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Domira:
    build:
      targets:
        Domira: all
    archive:
      config: Release
